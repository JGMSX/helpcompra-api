spring.application.name=helpcompra-api

# Banco SQLite (mesmo das aulas). O arquivo 'helpcompra.db' é criado na raiz do projeto se não existir.
spring.datasource.url=jdbc:sqlite:helpcompra.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
# SQLite aceita uma escrita por vez: uma única conexão evita erros de "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# Dialeto Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# 'update' cria/ajusta as tabelas automaticamente ao iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Mude para true para ver no console os comandos SQL executados
spring.jpa.show-sql=false

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
